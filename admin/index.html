<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SuperTeam11 Admin</title><link rel="stylesheet" href="style.css"></head><body><header><h1>SuperTeam11 <span>Admin</span></h1><p>Manual match management · API integration not configured</p></header><main><section class="card"><h2>Create match manually</h2><form id="matchForm"><label>Team A<input name="teamA" required maxlength="50" placeholder="e.g. India"></label><label>Team B<input name="teamB" required maxlength="50" placeholder="e.g. Australia"></label><label>Match type<select name="type"><option>T20</option><option>ODI</option><option>Test</option><option>League</option></select></label><label>Start time<input name="start" type="datetime-local" required></label><button>Create match</button></form></section><section class="card"><h2>Matches</h2><p id="empty">No matches added yet.</p><div id="matches"></div><button id="export" class="secondary" type="button">Export JSON</button></section><section class="card"><h2>Cricket API</h2><p>Not configured. Add a provider and secret key on the secured backend later. Never place API keys in this browser page.</p><span class="status">Manual mode active</span></section></main><script src="admin.js"></script></body></html>
